name: VoidBridge Server
# Must match the release tag without the "v" (CI refuses to release otherwise).
version: "0.4.0"
slug: voidbridge_server
description: Your own VoidBridge server, for end-to-end encrypted clipboard sync between your devices.
url: https://github.com/TheFormOfVoid/VoidBridge
arch:
  - aarch64
  - amd64
  - armv7
# Published by CI (.github/workflows/build.yml); Home Assistant pulls the tag that equals version.
image: ghcr.io/theformofvoid/voidbridge-server-{arch}
init: false
startup: services
boot: auto
# Devices on the home network find the server at the Pi's own address, and
# the server needs their real IPs to tell home-network requests from internet ones.
host_network: true
map:
  - type: ssl
    read_only: true
options:
  port: 47831
  signup: invite
schema:
  port: port
  domain: str?
  email: str?
  certfile: str?
  keyfile: str?
  signup: list(invite|open)
