name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # for publishing releases on tags

jobs:
  go:
    name: Desktop app & server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go test -race ./...
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=$VERSION"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -tags desktop,production \
              -ldflags "-H windowsgui $LDFLAGS" -o dist/VoidBridge-windows-$arch.exe ./cmd/voidbridge
          done
          for target in linux/arm64 linux/arm/7 linux/amd64; do
            IFS=/ read -r os arch arm <<< "$target"
            name="voidbridge-server-$os-$arch${arm:+v$arm}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -trimpath -ldflags "$LDFLAGS" -o dist/$name ./cmd/voidbridge-server
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: VoidBridge-windows
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VoidBridge-server
          path: dist/voidbridge-server-*

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: gradle/actions/setup-gradle@v4

      - name: Start Go devices and server for the interop tests
        run: |
          go build -o /tmp/interop ./tools/interop
          /tmp/interop -code ABCD-EFGH-IJKL-MNOP -peer 47829 -server 47831 > /tmp/interop.log 2>&1 &
          for i in $(seq 1 50); do grep -q READY /tmp/interop.log && break; sleep 0.2; done
          {
            echo "VOIDBRIDGE_INTEROP_PEER=127.0.0.1:47829"
            echo "VOIDBRIDGE_INTEROP_CODE=ABCD-EFGH-IJKL-MNOP"
            echo "VOIDBRIDGE_INTEROP_SERVER=127.0.0.1:47831"
          } >> "$GITHUB_ENV"

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.VOIDBRIDGE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VOIDBRIDGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VOIDBRIDGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VOIDBRIDGE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            {
              echo "VOIDBRIDGE_KEYSTORE_PATH=/tmp/release.jks"
              echo "VOIDBRIDGE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "VOIDBRIDGE_KEY_ALIAS=$KEY_ALIAS"
              echo "VOIDBRIDGE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; the APK is signed with a throwaway key, so each new build needs an uninstall first (which also removes the phone-setup permissions). See README → Stable APK signing."
          fi

      - name: Test and build
        working-directory: android
        env:
          VOIDBRIDGE_VERSION_CODE: ${{ github.run_number }}
          VOIDBRIDGE_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.2.0-{0}', github.run_number) }}
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: Go side of the interop tests
        if: always()
        run: cat /tmp/interop.log || true

      - run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/VoidBridge-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VoidBridge-android
          path: dist/*.apk

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
